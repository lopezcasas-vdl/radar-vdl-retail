<style>
:root{
  color-scheme:dark;
  --navy:#00002b; --navy-surface:#00004b; --lime:#aae05a; --lime-bright:#c9ef86; --lime-soft:#d9f2ad; --lime-contraste:#ecffcc;
  --violeta:#2e0e54; --rosa:#b41e82; --rosa-medio:#e05fae; --rosa-contraste:#ffd7f6; --azul:#c7d2ff; --error:#ff7db8;
  --text:#ffffff; --title:#fdfef8; --line:rgba(255,255,255,.16); --line-strong:rgba(255,255,255,.22);
  --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.10);
  --panel:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05)),rgba(0,0,43,.84);
  --sh-card:0 16px 42px rgba(5,3,22,.35); --sh-popup:0 40px 100px rgba(5,3,22,.55); --sh-lift:0 14px 32px rgba(5,3,22,.4);
  --gutter:clamp(20px,4vw,48px);
  --f-title:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --velo-copy:linear-gradient(90deg,rgba(46,14,84,.9) 0%,rgba(46,14,84,.82) 30%,rgba(46,14,84,.44) 52%,rgba(46,14,84,0) 76%);
  --velo-copy-movil:linear-gradient(180deg,rgba(46,14,84,.92) 0%,rgba(46,14,84,.84) 46%,rgba(46,14,84,.4) 68%,rgba(46,14,84,0) 88%);
  --bg-prefooter:
    radial-gradient(52% 105% at 97% 106%,rgba(170,224,90,1),rgba(170,224,90,0) 58%),
    radial-gradient(56% 118% at 88% 2%,rgba(178,140,246,.95),rgba(178,140,246,0) 66%),
    radial-gradient(58% 108% at 62% 100%,rgba(214,42,158,.95),rgba(214,42,158,0) 64%),
    radial-gradient(82% 120% at 30% 104%,rgba(180,30,130,.9),rgba(180,30,130,0) 72%),
    radial-gradient(100% 135% at 2% 18%,rgba(108,74,158,.95),rgba(108,74,158,0) 82%),
    #00002b;
}
*{box-sizing:border-box}
html{background:var(--navy)}
body{background:var(--navy);color:var(--text);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.hdr{position:fixed;inset:0 0 auto;z-index:50;border-bottom:1px solid transparent;transition:border-color .3s;padding-top:env(safe-area-inset-top,0px)}
.hdr::before,.hdr::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
.hdr::before{background:linear-gradient(to bottom,rgba(0,0,20,.34),rgba(0,0,20,0));transition:opacity .3s}
.hdr::after{background-color:rgba(0,0,20,0);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:background-color .3s,backdrop-filter .3s}
.hdr.solido{border-bottom-color:rgba(255,255,255,.16)}
.hdr.solido::before{opacity:0}
.hdr.solido::after{background-color:rgba(0,0,20,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--gutter)}
.logo{display:block;height:38px;width:auto}
.logo-link{display:inline-flex;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 26px;font-family:var(--f-title);font-weight:500;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none;border:1px solid transparent;transition:transform .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.btn-primary{background:var(--lime);color:var(--navy)}
.btn-primary:hover{background:var(--lime-bright);transform:translateY(-2px)}
.btn-ghost{background:transparent;border-color:var(--lime);color:var(--lime)}
.btn-ghost:hover{border-color:#fff;color:#fff;transform:translateY(-2px)}
.btn-quiet{background:transparent;border-color:var(--line-strong);color:#fff}
.btn-quiet:hover{border-color:#fff;transform:translateY(-2px)}
.btn-sm{padding:11px 20px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.textbtn{background:none;border:0;padding:6px 0;color:#fff;font-family:var(--f-body);font-weight:300;font-size:14px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.4);text-underline-offset:4px}
.textbtn:hover{text-decoration-color:#fff}

/* hero */
.hero{background:var(--velo-copy),var(--bg-prefooter);padding:calc(96px + env(safe-area-inset-top,0px)) var(--gutter) clamp(56px,6vw,96px)}
@media (max-width:900px){.hero{background:var(--velo-copy-movil),var(--bg-prefooter)}}
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);background:var(--panel);border:1px solid var(--line-strong);border-radius:32px;box-shadow:var(--sh-popup);overflow:clip}
.panel{padding:40px 40px 34px;display:flex;flex-direction:column;gap:20px;min-width:0}
.mapcol{position:relative;background:rgba(0,0,43,.72);border-left:1px solid var(--line);min-width:0}
.mapsticky{position:sticky;top:70px}
@media (max-width:900px){
  .stage{grid-template-columns:1fr;border-radius:26px}
  .mapcol{border-left:0;border-bottom:1px solid var(--line);order:-1}
  .mapsticky{position:relative;top:0}
  .panel{padding:26px 20px 24px}
}

/* type */
.eyebrow{font-family:var(--f-title);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime-soft)}
h1,h2,h3,h4{font-family:var(--f-title);font-weight:700;color:var(--title);margin:0;text-wrap:balance}
h1{font-size:clamp(34px,4.2vw,56px);line-height:1.04;letter-spacing:-.02em}
h2{font-size:clamp(26px,2.9vw,36px);line-height:1.15;letter-spacing:-.01em}
h3{font-size:clamp(20px,2vw,24px);line-height:1.3}
.intro{font-size:18px;line-height:1.55;max-width:52ch;margin:0}
p{margin:0}
.info{font-weight:300;font-size:14px;line-height:1.55}
.tab{font-variant-numeric:tabular-nums}
.progress{display:flex;gap:5px}
.progress i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.16);transition:background .3s}
.progress i.on{background:var(--lime)}

/* search */
.search{position:relative;z-index:10}
.search input{width:100%;border:1px solid var(--line-strong);background:var(--navy-surface);border-radius:14px;padding:17px 18px 17px 48px;font-size:17px;color:#fff;transition:border-color .2s}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search input:focus{outline:none;border-color:var(--lime)}
.search .ico{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#fff}
.sugg{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 8px);background:var(--navy-surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--sh-popup);overflow:hidden auto;max-height:340px}
.sugg button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.act{background:rgba(170,224,90,.14)}
.sugg b{font-weight:500}
.sugg mark{background:transparent;color:var(--lime);font-weight:500}
.sugg span{font-weight:300;font-size:13px;white-space:nowrap}
.sugg .none{padding:14px 16px;font-weight:300}
.stats{display:flex;flex-wrap:wrap;gap:22px 34px;padding-top:4px}
.stat b{display:block;font-family:var(--f-title);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1;color:var(--lime)}
.stat span{font-weight:300;font-size:14px}

/* ficha */
.ficha{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--glass)}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.ficha dt,.ficha dd{margin:0;padding:11px 16px;border-bottom:1px solid var(--line)}
.ficha dt{font-weight:300;font-size:14px}
.ficha dd{text-align:right;overflow-wrap:anywhere}
.ficha dl > :nth-last-child(-n+2){border-bottom:0}
.ficha input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px;background:var(--navy-surface);color:#fff;text-align:right}
.tag{display:inline-block;font:700 11px/1.4 var(--f-title);letter-spacing:2px;text-transform:uppercase;color:var(--rosa-medio);background:rgba(255,215,246,.14);padding:4px 9px 4px 10px;border-radius:6px;margin-left:8px;vertical-align:2px}
.sba{display:grid;gap:12px}
.sba label{font-family:var(--f-title);font-weight:700;font-size:15px}
.sbarow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;background:var(--navy-surface);color:#fff;font-size:17px}
.field::placeholder{color:rgba(255,255,255,.65)}
.field:focus{outline:none;border-color:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:border-color .2s}
.chip:hover{border-color:#fff}
.chip.on{background:#fff;color:var(--navy);border-color:#fff}
.afl{background:var(--navy-surface);border:1px solid var(--line);border-radius:26px;padding:20px 24px;display:grid;gap:4px}
.afl .n{font-family:var(--f-title);font-weight:700;font-size:clamp(34px,4vw,48px);letter-spacing:-.02em;line-height:1.05;color:var(--title)}
.afl .n em{font-style:normal;color:var(--lime)}

/* question */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line-strong);background:var(--glass);color:#fff;border-radius:14px;padding:15px 16px;cursor:pointer;transition:border-color .2s,background-color .2s}
.opt:hover{border-color:#fff}
.opt.on{border-color:var(--lime);background:rgba(170,224,90,.12)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line-strong);display:grid;place-items:center;font:700 11px/1 var(--f-title)}
.opt.on .k{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* map */
.map{display:block;width:100%;height:680px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.map.dragging{cursor:grabbing}
@media (max-width:900px){.map{height:auto;aspect-ratio:1000/760}}
.map .prov{fill:#0a0a5e;stroke:rgba(255,255,255,.16);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .2s}
.map .prov.hl{fill:#1d2270}
.map .nation{fill:none;stroke:rgba(255,255,255,.34);stroke-width:.9;vector-effect:non-scaling-stroke}
.map .canbox{fill:none;stroke:rgba(255,255,255,.3);stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.map .dot{fill:#fff;fill-opacity:.62;cursor:pointer;transition:fill-opacity .2s}
.map .dot:hover{fill:var(--lime);fill-opacity:1}
.map.picked .dot{fill-opacity:.3}
.map .sel{fill:var(--lime);stroke:var(--navy);stroke-width:1.4;vector-effect:non-scaling-stroke}
.map .ring{fill:none;stroke:var(--lime);stroke-width:1.4;vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:no-preference){.map .ring{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.map .lbl{font-family:var(--f-title);font-weight:700;fill:#fff;paint-order:stroke;stroke:var(--navy);stroke-linejoin:round}
.mapctl{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(0,0,43,.84);color:#fff;font:500 18px/1 var(--f-title);cursor:pointer;display:grid;place-items:center;transition:border-color .2s}
.mapctl button:hover{border-color:#fff}
.maphud{position:absolute;left:16px;right:72px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;pointer-events:none}
.hudnote{font-weight:300;font-size:13px;background:rgba(0,0,43,.84);border:1px solid var(--line);padding:5px 10px;border-radius:6px}
.osm{font-weight:300;font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--navy-surface);border:1px solid var(--line-strong);color:#fff;font-size:13px;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-135%);z-index:3}
@media (max-width:900px){.maphud{position:static;padding:8px 14px 12px}}

/* results */
.score{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.score .big{font-family:var(--f-title);font-weight:700;font-size:clamp(68px,8vw,96px);line-height:.85;letter-spacing:-.04em;color:var(--lime)}
.score .big small{font-size:.3em;color:#fff;letter-spacing:-.01em}
.lvl{justify-self:start;display:inline-block;font:700 11px/1.4 var(--f-title);letter-spacing:2px;text-transform:uppercase;padding:5px 10px 5px 12px;border-radius:6px}
.lvl.l0{color:var(--error);background:rgba(255,125,184,.14)}
.lvl.l1{color:var(--azul);background:rgba(199,210,255,.14)}
.lvl.l2{color:var(--lime);background:rgba(170,224,90,.14)}
.gap{border-radius:26px;background:var(--navy-surface);border:1px solid var(--line);padding:22px 24px;display:grid;gap:8px;box-shadow:var(--sh-card)}
.gap strong{font-family:var(--f-title);font-weight:700;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.015em;line-height:1.15;color:var(--title)}
.gap strong em{font-style:normal;color:var(--lime)}
.axes{display:grid;border-top:1px solid var(--line)}
.ax{display:grid;gap:9px;padding:18px 0;border-bottom:1px solid var(--line)}
.ax-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ax-head b{font-family:var(--f-title);font-weight:700;font-size:17px}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lime);border-radius:6px}
.radarwrap{display:flex;justify-content:center}
.radar{width:100%;max-width:400px;height:auto}
.radar .grid{fill:none;stroke:rgba(255,255,255,.18)}
.radar .area{fill:var(--lime);fill-opacity:.28;stroke:var(--lime);stroke-width:1.6}
.radar text{font-family:var(--f-title);font-weight:700;font-size:10.5px;letter-spacing:.08em;fill:#fff}
.radar .pt{fill:var(--lime)}
.group{display:grid;gap:10px;border:1px dashed var(--line-strong);border-radius:26px;padding:18px 22px}
.group .n{font-family:var(--f-title);font-weight:700;font-size:28px;letter-spacing:-.02em;color:var(--lime)}
.form{display:grid;gap:12px;background:var(--glass);border:1px solid var(--line-strong);border-radius:26px;padding:24px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form .row{grid-template-columns:1fr}}
.form label{display:grid;gap:5px;font-weight:300;font-size:14px}
.form .field{font-size:16px;width:100%}
.consent{display:flex!important;gap:10px;align-items:flex-start}
.consent input{margin-top:4px;accent-color:var(--lime)}
.consent a{text-decoration:underline;text-underline-offset:3px}
.ok{border-radius:26px;padding:20px 22px;background:rgba(170,224,90,.12);border:1px solid rgba(170,224,90,.4);display:grid;gap:6px}
.err{color:var(--error);font-size:14px}

/* footer */
.foot{background:var(--navy);border-top:1px solid var(--line)}
.foot-in{max-width:1240px;margin:0 auto;padding:28px var(--gutter) calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.foot .logo{height:32px}
.legal{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 24px;font-weight:300;font-size:14px}
.legal a{text-decoration:none;opacity:.7;transition:opacity .2s}
.legal a:hover{opacity:1}
@media (prefers-reduced-motion:no-preference){.panel > *{animation:rise .35s ease both}}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
</style>
</head>

const FULL=[0,0,1000,720], MINW=40;
let vb=FULL.slice(), anim=null;
function clampVB(v){let [x,y,w,h]=v;w=Math.max(MINW,Math.min(1000,w));h=w*0.72;
  x=Math.max(-w*0.5,Math.min(1000-w*0.5,x));y=Math.max(-h*0.5,Math.min(720-h*0.5,y));return [x,y,w,h]}
function setVB(v){vb=clampVB(v);svg.setAttribute("viewBox",vb.map(n=>n.toFixed(2)).join(" "));const k=1000/vb[2];
  const r=(2.8/Math.pow(k,0.72)).toFixed(3);dotEls.forEach(d=>d.setAttribute("r",r));
  gSel.querySelectorAll("[data-s]").forEach(n=>{const s=+n.dataset.s;if(n.tagName==="text"){n.setAttribute("font-size",(s/k).toFixed(2));n.setAttribute("stroke-width",(4/k).toFixed(2))}else n.setAttribute("r",(s/Math.pow(k,0.85)).toFixed(2))});}
function zoomTo(target,ms=800){cancelAnimationFrame(anim);const from=vb.slice(),to=clampVB(target),t0=performance.now();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)ms=0;
  const step=now=>{const p=ms?Math.min(1,(now-t0)/ms):1,e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    setVB(from.map((f,i)=>f+(to[i]-f)*e));if(p<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function svgPoint(cx,cy){const m=svg.getScreenCTM();if(!m)return [vb[0]+vb[2]/2,vb[1]+vb[3]/2];const p=new DOMPoint(cx,cy).matrixTransform(m.inverse());return [p.x,p.y]}
function zoomAround(f,px,py,ms=0){const w=Math.max(MINW,Math.min(1000,vb[2]/f)),h=w*0.72;
  const t=[px-(px-vb[0])*(w/vb[2]),py-(py-vb[1])*(h/vb[3]),w,h];ms?zoomTo(t,ms):(cancelAnimationFrame(anim),setVB(t))}

svg.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);cancelAnimationFrame(anim);
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,vb:vb.slice()};moved=false}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:vb.slice(),c:svgPoint((a.x+b.x)/2,(a.y+b.y)/2)};drag=null}});

  <div class="search">

function scores(){const out={};AXES.forEach(a=>{let s=0,m=0;Q.forEach((q,i)=>{if(q.ax!==a.id||q.num)return;m+=3;s+=(S.answers[i]??0)});out[a.id]=Math.round(s/m*100)});

let LOGO_PNG=null;
function logoPng(){if(LOGO_PNG)return Promise.resolve(LOGO_PNG);return new Promise(res=>{try{

  doc.setTextColor(217,242,173);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("RADAR VDL · CENTROS COMERCIALES",W-M,17,{align:"right"});
  doc.setTextColor(255,255,255);doc.setFontSize(20);doc.text("Diagnóstico de madurez digital",M,40);
  doc.setFont("helvetica","normal");doc.setFontSize(11);doc.text(doc.splitTextToSize(p.center+(p.city||p.province?" · "+[p.city,p.province].filter(Boolean).join(", "):""),W-2*M),M,48);
  y=72;doc.setTextColor(...TITLE);doc.setFont("helvetica","bold");doc.setFontSize(40);doc.text(String(sc.total),M,y+6);
  const tw=doc.getTextWidth(String(sc.total));doc.setFontSize(14);doc.setTextColor(...SEC);doc.text("/100",M+tw+2,y+6);
  doc.setFontSize(10);doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.text(level(sc.total)[1].toUpperCase(),M+tw+20,y);
  doc.setFont("helvetica","normal");doc.text("Madurez digital media en los 5 ejes",M+tw+20,y+6);
  y+=18;doc.setFillColor(...SURF);doc.roundedRect(M,y,W-2*M,26,4,4,"F");
  doc.setTextColor(217,242,173);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("AFLUENCIA ESTIMADA Y BRECHA DE VISITANTE ANÓNIMO",M+6,y+7);
  doc.setTextColor(255,255,255);doc.setFontSize(13);
  const gapTxt=p.knownContacts?`${fmtShort(p.visitsEstimate)} visitas/año · 1 contacto por cada ${fmt(p.visitsEstimate/p.knownContacts)} visitas`:`${fmtShort(p.visitsEstimate)} visitas/año · sin cifra de visitantes identificados`;
  doc.text(gapTxt,M+6,y+15);doc.setFont("helvetica","normal");doc.setFontSize(9);
  doc.text(`SBA: ${fmt(p.sba)} m2${p.knownContacts?` · ${fmt(p.knownContacts)} personas identificadas`:""}${p.centersInGroup>1?` · cartera de ${p.centersInGroup} centros`:""}`,M+6,y+21);
  y+=36;doc.setTextColor(...TITLE);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Resultados por eje y por dónde empezar",M,y);y+=6;
  const ordered=AXES.slice().sort((a,b)=>sc[a.id]-sc[b.id]);
  for(const a of ordered){const v=sc[a.id],[l,t]=level(v);const tip=doc.splitTextToSize(WINS[a.id][l],W-2*M);
    const h=18+tip.length*4.6;if(y+h>282){doc.addPage();y=20}
    doc.setDrawColor(220,220,228);doc.line(M,y,W-M,y);y+=7;
    doc.setTextColor(...TITLE);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(a.name,M,y);
    doc.setFontSize(9);doc.setTextColor(...INK);doc.text(`${t.toUpperCase()} · ${v}/100`,W-M,y,{align:"right"});
    y+=3;doc.setFillColor(232,232,238);doc.roundedRect(M,y,W-2*M,2.4,1.2,1.2,"F");doc.setFillColor(...LIME);doc.roundedRect(M,y,Math.max(2,(W-2*M)*v/100),2.4,1.2,1.2,"F");
    y+=7;doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(...INK);doc.text(tip,M,y);y+=tip.length*4.6;
    doc.setFontSize(8.5);doc.setTextColor(...SEC);doc.text("Cómo lo trabaja VdL: "+a.svc,M,y);y+=4}
  doc.addPage();y=20;doc.setTextColor(...TITLE);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Respuestas del cuestionario",M,y);y+=8;
  p.answers.forEach((r,i)=>{const qq=doc.splitTextToSize(`${i+1}. ${r.q}`,W-2*M),aa=doc.splitTextToSize(typeof r.a==="number"?fmt(r.a)+" personas":String(r.a??"—"),W-2*M-4);
    if(y+qq.length*4.4+aa.length*4.4+5>282){doc.addPage();y=20}
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...INK);doc.text(qq,M,y);y+=qq.length*4.4;
    doc.setFont("helvetica","normal");doc.setTextColor(...SEC);doc.text(aa,M+4,y);y+=aa.length*4.4+3});
  if(y>230){doc.addPage();y=20}
  y+=6;doc.setFillColor(...NAVY);doc.roundedRect(M,y,W-2*M,34,4,4,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text("Revisemos juntos tu plan de acción",M+7,y+11);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text("Reserva 30 minutos con el equipo de Valor de Ley:",M+7,y+19);
  doc.setTextColor(...LIME);doc.textWithLink(CONFIG.BOOKING_URL,M+7,y+26,{url:CONFIG.BOOKING_URL});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(...SEC);
    doc.text(`Valor de Ley · valordeley.es · Informe generado el ${new Date(p.createdAt).toLocaleDateString("es-ES")}`,M,290);doc.text(`${i}/${n}`,W-M,290,{align:"right"})}
  return doc.output("blob");
}

/* ===== Envío del lead ===== */
const blobToBase64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
async function submitLead(e,sc,visits,known){e.preventDefault();const f=e.target,err=$("#lErr");
  const name=$("#lName").value.trim(),mail=$("#lMail").value.trim();
  if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){err.textContent="Escribe tu nombre y un email válido para enviarte el informe.";err.hidden=false;return}
  if(!$("#lOk").checked){err.textContent="Acepta la política de privacidad para que podamos enviarte el informe.";err.hidden=false;return}
  err.hidden=true;const c=S.center;
  const p={createdAt:new Date().toISOString(),name,role:$("#lRole").value.trim(),email:mail,phone:$("#lTel").value.trim(),
    center:c.name,city:c.city||"",province:c.prov||"",fromMap:!!c.osm,sba:S.sba,visitsEstimate:Math.round(visits),knownContacts:typeof known==="number"?known:null,
    centersInGroup:S.centersInGroup,scores:sc,level:level(sc.total)[1],answers:Q.map((q,i)=>({axis:q.ax,q:q.q,a:q.num?(S.answers[i]==="skip"?"No lo sé":S.answers[i]):q.o[S.answers[i]]}))};
  const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Enviando…";
  const fileName=`Radar-VdL-${c.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")}.pdf`;
  let pdf=null;try{pdf=await buildPdf(p,sc)}catch(_){}
  const jobs=[];
  if(CONFIG.WEBHOOK_URL){const fd=new FormData();fd.append("data",JSON.stringify(p));Object.entries({name:p.name,email:p.email,role:p.role,phone:p.phone,center:p.center,city:p.city,province:p.province,sba:p.sba,visitsEstimate:p.visitsEstimate,knownContacts:p.knownContacts??"No lo sabe",centersInGroup:p.centersInGroup,score:p.scores.total,level:p.level,createdAt:p.createdAt}).forEach(([k,v])=>fd.append(k,String(v??"")));
    fd.append("fileName",fileName);if(pdf){fd.append("pdfBase64",await blobToBase64(pdf))}
    jobs.push(fetch(CONFIG.WEBHOOK_URL,{method:"POST",body:fd}).then(r=>r.ok).catch(()=>false))}
  if(CONFIG.EMAIL_ENDPOINT){jobs.push(fetch(CONFIG.EMAIL_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({
      _subject:`Nuevo lead Radar VdL · ${p.center}`,_template:"table",_captcha:"false",
      Nombre:p.name,Cargo:p.role,Email:p.email,"Teléfono":p.phone,Centro:p.center,Municipio:p.city,Provincia:p.province,"SBA (m²)":fmt(p.sba),
      "Afluencia estimada":fmt(p.visitsEstimate),"Personas identificadas":p.knownContacts??"No lo sabe","Centros en cartera":p.centersInGroup,
      "Nota global":`${p.scores.total}/100 (${p.level})`,...Object.fromEntries(AXES.map(a=>["Eje · "+a.name,`${p.scores[a.id]}/100`])),"Fecha":new Date(p.createdAt).toLocaleString("es-ES")})})
    .then(r=>r.ok).catch(()=>false))}
  let results=await Promise.all(jobs);let saved=results.some(Boolean);
  try{const db=await (window.claude?.use?.("db"));if(db){await db.collection("leads").add(p);saved=true}}catch(_){}
  f.outerHTML=saved?`<div class="ok"><h3>Recibido, ${esc(name.split(" ")[0])}.</h3><p>Te enviaremos el informe de ${esc(c.name)} a ${esc(mail)}. Si prefieres adelantar la conversación, <a data-book href="${esc(CONFIG.BOOKING_URL)}" target="_blank" rel="noopener">reserva aquí 30 minutos</a>.</p></div>`
    :`<div class="ok"><h3>No hemos podido registrar el envío.</h3><p>Escríbenos a ${esc(CONFIG.EMAIL_TO)} o <a data-book href="${esc(CONFIG.BOOKING_URL)}" target="_blank" rel="noopener">reserva una reunión</a> y te enviamos el informe de ${esc(c.name)}.</p></div>`;
}
render();
</script>
